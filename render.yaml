services:
  - type: web
    name: mchanaq-backend
    runtime: python
    plan: free
    buildCommand: pip install -r src/backend/requirements.txt
    startCommand: uvicorn src.backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: MCHANAQ_DATA_DIR
        value: data/fixtures
      - key: MCHANAQ_CORS_ORIGINS
        value: https://mchanaq-frontend.onrender.com

  - type: web
    name: mchanaq-frontend
    runtime: static
    rootDir: src/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        value: https://mchanaq-backend.onrender.com/api/v1
