<!--
  Marca de McHanaq para la pestaña del navegador.

  A 16 px no sobrevive casi nada: los paralelos, el meridiano y las órbitas de
  la marca completa se funden en una mancha. Aquí queda lo mínimo que todavía
  se reconoce —un aro grueso y la brasa— sobre un cuadro oscuro, que es lo que
  separa el icono de las pestañas claras del navegador.

  Los trazos son deliberadamente gordos: a tamaño de favicon, un trazo fino
  desaparece al rasterizar y deja el aro roto.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#07100b"/>

  <!-- Aro del planeta. -->
  <circle cx="32" cy="32" r="18" fill="none" stroke="#f2f7ef" stroke-width="5"/>

  <!-- Un solo paralelo, el ecuador: basta para que el aro se lea como esfera
       y no como una letra O. -->
  <path d="M15 32h34" stroke="#f2f7ef" stroke-width="3.4" opacity="0.45"/>

  <!-- La brasa: el único elemento con color, y el que dice de qué va esto.
       Lleva su propio hueco para no tocar el aro ni el ecuador. -->
  <circle cx="43" cy="44" r="12" fill="#07100b"/>
  <circle cx="43" cy="44" r="8" fill="#ff5a2b"/>
</svg>
