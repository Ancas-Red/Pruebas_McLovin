<!--
  Marca de McHanaq para la pestaña del navegador, homogeneizada con el logo
  completo del navbar (globo + órbita inclinada + satélite).
  Trazos gruesos para mantener legibilidad incluso a 16×16 px.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#07100b" />

  <!-- Órbita trasera tenue -->
  <g transform="translate(31 34) rotate(-28)">
    <ellipse cx="0" cy="0" rx="25.5" ry="10.5" fill="none" stroke="#f2f7ef" stroke-width="2.6" opacity="0.32" />
  </g>

  <!-- Planeta + meridiano/paralelo mínimos -->
  <circle cx="31" cy="34" r="15.5" fill="#07100b" stroke="#f2f7ef" stroke-width="3.6" />
  <ellipse cx="31" cy="34" rx="6.5" ry="15.5" fill="none" stroke="#f2f7ef" stroke-width="2" opacity="0.5" />
  <path d="M16.5 34h29" stroke="#f2f7ef" stroke-width="2" opacity="0.5" />

  <!-- Arco frontal de órbita -->
  <g transform="translate(31 34) rotate(-28)">
    <path
      d="M -23 4.4 A 25.5 10.5 0 0 0 23 -4.4"
      fill="none"
      stroke="#f2f7ef"
      stroke-width="3"
      stroke-linecap="round"
    />
  </g>

  <!-- Satélite arriba a la derecha sobre la órbita -->
  <g transform="translate(49 20) rotate(-28)" fill="#d8ff33" stroke="#d8ff33" stroke-width="1.6">
    <rect x="-3.4" y="-3.4" width="6.8" height="6.8" />
    <rect x="-10" y="-2.2" width="4.8" height="4.4" fill="none" />
    <rect x="5.2" y="-2.2" width="4.8" height="4.4" fill="none" />
  </g>

  <!-- Brasa discreta dentro del globo -->
  <circle cx="36" cy="41.5" r="3.4" fill="#ff5a2b" />
</svg>
